[tool.poetry]
name = "trading-platform"
version = "0.1.0"
description = "Çok ajanlı AI trading platformu"
authors = ["Trading Team <trading@example.com>"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.6.4"
pydantic-settings = "^2.1.0"
python-binance = "^1.0.32"
websockets = "^12.0"
httpx = "^0.27.0"
redis = "^5.0.1"
influxdb-client = "^1.43.0"
pyqlib = "^0.9.3"
lightgbm = "^4.3.0"
scikit-learn = "^1.4.2"
pandas = "^2.2.2"
numpy = "^1.26.4"
streamlit = "^1.37.1"
tenacity = "^8.2.3"
pyyaml = "^6.0.1"
ta = "^0.11.0"
anthropic = "^0.75.0"
fastapi = "^0.115.0"
uvicorn = {version = "^0.32.0", extras = ["standard"]}
playwright = "^1.46.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.5"
black = "^24.4.2"
isort = "^5.13.2"
mypy = "^1.10.0"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring external services",
]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
