# Backtesting Scenarios Definition
# Bu dosya farklı test senaryolarını tanımlar

scenarios:
  # Scenario 1: Baseline - Mevcut Strateji
  baseline:
    name: "Mevcut Strateji (Baseline)"
    description: "Mevcut GLM-4 + Multi-Agent stratejisini test et"
    parameters:
      start_date: "2023-01-01"
      end_date: "2024-12-31"
      timeframe: "15m"
      confidence_threshold: 0.65
      risk_per_trade: 0.02
      cooldown_minutes: 15

  # Scenario 2: Conservative
  conservative:
    name: "Konservatif Yaklaşım"
    description: "Düşük risk, yüksek güvenilirlik"
    parameters:
      start_date: "2023-01-01"
      end_date: "2024-12-31"
      timeframe: "30m"
      confidence_threshold: 0.80
      risk_per_trade: 0.01
      cooldown_minutes: 30
      max_position_size: 0.5

  # Scenario 3: Aggressive
  aggressive:
    name: "Agresif Yaklaşım"
    description: "Yüksek risk, yüksek getiri"
    parameters:
      start_date: "2023-01-01"
      end_date: "2024-12-31"
      timeframe: "5m"
      confidence_threshold: 0.50
      risk_per_trade: 0.05
      cooldown_minutes: 0
      max_position_size: 2.0

  # Scenario 4: Bull Market
  bull_market:
    name: "Boğa Piyasası Optimizasyonu"
    description: "2023 Q4 gibi güçlü bull market dönemleri"
    parameters:
      start_date: "2023-10-01"
      end_date: "2024-03-31"
      timeframe: "15m"
      confidence_threshold: 0.60
      risk_per_trade: 0.03
      max_position_size: 1.5

  # Scenario 5: Bear Market
  bear_market:
    name: "Ayı Piyasası Optimizasyonu"
    description: "2022 gibi düşüş dönemleri"
    parameters:
      start_date: "2022-06-01"
      end_date: "2022-12-31"
      timeframe: "30m"
      confidence_threshold: 0.75
      risk_per_trade: 0.01
      max_position_size: 0.5

  # Scenario 6: Sideways Market
  sideways:
    name: "Yatay Piyasa"
    description: "Volatilite düşük, net trend olmayan dönemler"
    parameters:
      start_date: "2024-04-01"
      end_date: "2024-06-30"
      timeframe: "1h"
      confidence_threshold: 0.70
      risk_per_trade: 0.015
      max_position_size: 0.75

  # Scenario 7: High Volatility
  high_volatility:
    name: "Yüksek Volatilite"
    description: "2024 Q1 gibi çok volatil dönemler"
    parameters:
      start_date: "2024-01-01"
      end_date: "2024-03-31"
      timeframe: "15m"
      confidence_threshold: 0.70
      risk_per_trade: 0.01
      stop_loss: 0.03
      take_profit: 0.06

  # Scenario 8: Parameter Sensitivity
  parameter_sensitivity:
    name: "Parametre Hassasiyet Analizi"
    description: "Farklı parametre kombinasyonlarını test et"
    parameters:
      start_date: "2023-01-01"
      end_date: "2024-12-31"
      timeframe: "15m"
      confidence_threshold: 0.65
      risk_per_trade: 0.02
      varies:
        - parameter: "confidence_threshold"
          values: [0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80]
        - parameter: "risk_per_trade"
          values: [0.01, 0.015, 0.02, 0.025, 0.03]
        - parameter: "timeframe"
          values: ["5m", "15m", "30m", "1h"]

  # Scenario 9: Walk-Forward Optimization
  walk_forward_optimization:
    name: "Walk-Forward Optimizasyon"
    description: "Rolling window ile sürekli optimize et"
    parameters:
      training_period_days: 180
      testing_period_days: 30
      step_size_days: 7
      parameter_ranges:
        confidence_threshold: [0.50, 0.80]
        risk_per_trade: [0.01, 0.05]
        timeframe: ["5m", "15m", "30m", "1h"]

  # Scenario 10: Monte Carlo
  monte_carlo:
    name: "Monte Carlo Simülasyonu"
    description: "1000+ rastgele path ile risk analizi"
    parameters:
      num_simulations: 1000
      confidence_levels: [0.90, 0.95, 0.99]
      bootstrap_samples: 500
      start_date: "2023-01-01"
      end_date: "2024-12-31"

# Benchmark Scenarios
benchmarks:
  btc_buy_and_hold:
    name: "BTC Buy and Hold"
    description: "En basit benchmark - sadece BTC al ve tut"
    strategy: "buy_and_hold"

  dollar_cost_averaging:
    name: "Dollar Cost Averaging"
    description: "Her hafta aynı miktarda BTC al"
    strategy: "dca"
    dca_interval_days: 7
    dca_amount: 100

  moving_average_crossover:
    name: "Moving Average Crossover"
    description: "20/50 EMA crossover stratejisi"
    strategy: "ema_crossover"
    fast_ema: 20
    slow_ema: 50

# Report Templates
report_templates:
  executive_summary:
    sections:
      - title: "Total Return"
        metrics: ["total_return", "cagr", "benchmark_return"]
      - title: "Risk Metrics"
        metrics: ["sharpe_ratio", "max_drawdown", "sortino_ratio"]
      - title: "Trade Analysis"
        metrics: ["win_rate", "profit_factor", "num_trades"]
      - title: "Monthly Performance"
        type: "heatmap"

  detailed_analysis:
    sections:
      - title: "Equity Curve"
        chart: "equity_curve"
      - title: "Drawdown"
        chart: "drawdown"
      - title: "Rolling Metrics"
        charts: ["rolling_sharpe", "rolling_sortino"]
      - title: "Trade Distribution"
        chart: "trade_distribution"